name: CI

on:
  push:
    branches:
      - main
      - "backend/**"
      - "frontend/**"
      - "qa/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: retina_trust_poc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            retina_trust_poc/requirements.txt
            retina_trust_poc/requirements.lock

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.lock ]]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi

      - name: Compile Python sources
        run: python -m compileall -q app.py retina_poc scripts tests

      - name: Verify scientific artifacts
        run: python scripts/verify_artifacts.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
